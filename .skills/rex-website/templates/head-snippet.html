<!-- REX <head> snippet. Replace SITE_URL, PAGE_TITLE, PAGE_DESCRIPTION, PAGE_PATH.
     Copy icons with: python .claude/skills/rex-website/scripts/copy_assets.py <public-dir> -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PAGE_TITLE | REX Cybersecurity</title>
<meta name="description" content="PAGE_DESCRIPTION">
<link rel="canonical" href="SITE_URL/PAGE_PATH">

<!-- Theme before first paint: stored choice > OS preference > dark -->
<script>(function(){try{var t=localStorage.getItem("rex-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">

<!-- Icons: asset/A-cut-r-mono/icons (small mark at 48px and below) -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<!-- Social card: 1200x630, rendered by scripts/render_og.py -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="REX Cybersecurity">
<meta property="og:title" content="PAGE_TITLE">
<meta property="og:description" content="PAGE_DESCRIPTION">
<meta property="og:url" content="SITE_URL/PAGE_PATH">
<meta property="og:image" content="SITE_URL/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="REX Cybersecurity logo on obsidian with blue and violet diagonal cuts.">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts: only these weights. Self-host (woff2, font-display: swap) when the site leaves prototype stage. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
